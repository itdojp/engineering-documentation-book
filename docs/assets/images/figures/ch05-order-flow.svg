<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title-ch05-order-flow desc-ch05-order-flow">
  <title id="title-ch05-order-flow">注文処理の最小フロー</title>
  <desc id="desc-ch05-order-flow">注文確定から入力検証へ進み、入力が正しければ決済リクエスト、成功時はDB保存へ進む。入力不備または決済失敗時は利用者への案内へ分岐する。</desc>
  <defs>
    <marker id="arrow-ch05-order-flow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="40" y="40" fill="#0f172a" font-family="sans-serif" font-size="26" font-weight="700">注文処理の最小フロー</text>
  <g font-family="sans-serif" text-anchor="middle">
    <rect x="60" y="180" width="145" height="70" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="132" y="222" fill="#0f172a" font-size="18">注文確定</text>
    <polygon points="325,160 415,215 325,270 235,215" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
    <text x="325" y="210" fill="#0f172a" font-size="17">入力は</text>
    <text x="325" y="232" fill="#0f172a" font-size="17">正しいか</text>
    <rect x="475" y="180" width="155" height="70" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="552" y="210" fill="#0f172a" font-size="17">決済</text>
    <text x="552" y="232" fill="#0f172a" font-size="17">リクエスト</text>
    <polygon points="750,160 840,215 750,270 660,215" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
    <text x="750" y="222" fill="#0f172a" font-size="17">成功か</text>
    <rect x="810" y="350" width="120" height="70" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="870" y="378" fill="#0f172a" font-size="16">注文を</text>
    <text x="870" y="400" fill="#0f172a" font-size="16">DB保存</text>
    <rect x="265" y="350" width="160" height="70" rx="12" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/>
    <text x="345" y="378" fill="#0f172a" font-size="16">項目別の</text>
    <text x="345" y="400" fill="#0f172a" font-size="16">エラー表示</text>
    <rect x="610" y="350" width="160" height="70" rx="12" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/>
    <text x="690" y="378" fill="#0f172a" font-size="16">再試行案内</text>
    <text x="690" y="400" fill="#0f172a" font-size="16">または失敗通知</text>
  </g>
  <g fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow-ch05-order-flow)">
    <path d="M205 215 H235"/>
    <path d="M415 215 H475"/>
    <path d="M630 215 H660"/>
    <path d="M750 270 V315 H870 V350"/>
    <path d="M325 270 V350"/>
    <path d="M750 270 V310 H690 V350"/>
  </g>
  <g fill="#475569" font-family="sans-serif" font-size="15">
    <text x="438" y="202">OK</text>
    <text x="334" y="320">NG</text>
    <text x="835" y="300">成功</text>
    <text x="678" y="300">失敗 / timeout</text>
  </g>
  <text x="40" y="482" fill="#475569" font-family="sans-serif" font-size="16">正常系だけでなく、入力不備と外部決済失敗の利用者向け結果まで描く。</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title-appendix-architecture-example desc-appendix-architecture-example">
  <title id="title-appendix-architecture-example">構成図テンプレートの記入例</title>
  <desc id="desc-appendix-architecture-example">利用者がHTTPSでアプリへ接続し、アプリがDB、Cache、ログへ接続し、ログが集約基盤へ送られる最小構成を示す。</desc>
  <defs>
    <marker id="arrow-appendix-architecture-example" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="500" fill="#ffffff"/>
  <text x="40" y="40" fill="#0f172a" font-family="sans-serif" font-size="26" font-weight="700">構成図テンプレートの記入例</text>
  <g fill="#ffffff" stroke-width="2">
    <rect x="50" y="185" width="130" height="70" rx="10" stroke="#2563eb"/>
    <rect x="260" y="185" width="150" height="70" rx="10" stroke="#16a34a"/>
    <rect x="500" y="95" width="140" height="64" rx="10" stroke="#16a34a"/>
    <rect x="500" y="275" width="140" height="64" rx="10" stroke="#16a34a"/>
    <rect x="500" y="365" width="140" height="64" rx="10" stroke="#16a34a"/>
    <rect x="760" y="365" width="150" height="64" rx="10" stroke="#7c3aed"/>
  </g>
  <g fill="#0f172a" font-family="sans-serif" font-size="18" text-anchor="middle">
    <text x="115" y="227">利用者</text>
    <text x="335" y="227">アプリ</text>
    <text x="570" y="133">DB</text>
    <text x="570" y="313">Cache</text>
    <text x="570" y="403">ログ</text>
    <text x="835" y="393">ログ集約</text>
    <text x="835" y="415">基盤</text>
  </g>
  <g fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow-appendix-architecture-example)">
    <path d="M180 220 H260"/>
    <path d="M410 205 C455 180 465 127 500 127"/>
    <path d="M410 230 C455 250 465 307 500 307"/>
    <path d="M410 242 C450 300 455 397 500 397"/>
    <path d="M640 397 H760"/>
  </g>
  <g fill="#475569" font-family="sans-serif" font-size="14">
    <text x="205" y="207">HTTPS</text>
    <text x="430" y="142">保存</text>
    <text x="430" y="292">参照</text>
    <text x="440" y="370">出力</text>
    <text x="675" y="384">転送</text>
  </g>
  <rect x="235" y="75" width="435" height="375" rx="16" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="255" y="105" fill="#14532d" font-family="sans-serif" font-size="17" font-weight="700">管理対象システム</text>
  <text x="40" y="470" fill="#475569" font-family="sans-serif" font-size="16">境界内の保管先と監視経路を、利用者からの通信と分けて示す。</text>
</svg>
